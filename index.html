<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="職能評価 教室">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>職能評価｜教室運営版</title>
<style>
:root{--navy:#0b1f3a;--blue:#1456a0;--line:#dce4ee;--soft:#f4f7fb;--text:#162333;--muted:#6b7785;--red:#c62828;--shadow:0 10px 30px rgba(14,35,61,.10)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--text);background:#eef3f8}
header{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{font-weight:800;font-size:18px}.sub{font-size:12px;opacity:.78;margin-top:2px}
main{max-width:760px;margin:0 auto;padding:18px 14px calc(100px + env(safe-area-inset-bottom))}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.hidden{display:none!important}
h1{font-size:24px;margin:0 0 8px}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}.lead{color:var(--muted);font-size:14px;line-height:1.6}
label.form{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}input,select{width:100%;font-size:16px;padding:13px 12px;border:1px solid #cfd8e3;border-radius:12px;background:#fff;color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.bigChoice{border:2px solid #d8e1eb;border-radius:16px;padding:17px 12px;background:#fff;text-align:left}.bigChoice strong{display:block;font-size:18px}.bigChoice span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.bigChoice.active{border-color:var(--blue);background:#eef6ff}
.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:800;background:var(--navy);color:#fff}.btn.secondary{background:#fff;color:var(--navy);border:1px solid #b9c6d5}.btn:disabled{opacity:.45}.rowBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.progress{height:7px;border-radius:99px;background:#e6edf5;overflow:hidden;margin:8px 0 18px}.progress>div{height:100%;background:var(--blue);width:0;transition:.2s}.eyebrow{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.04em}.titleBox{padding:14px;border-radius:14px;background:var(--soft);margin:10px 0 14px}.titleBox .def{color:#526273;font-size:13px;line-height:1.55;margin-top:6px}
.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}.rateBtn{border:1px solid #cfd8e3;background:#fff;border-radius:12px;padding:13px 0;font-size:17px;font-weight:900}.rateBtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.section{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.sectionHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{min-width:42px;text-align:center;padding:5px 9px;border-radius:999px;background:#eef3f8;font-weight:900}.heading{font-weight:800;line-height:1.45;margin-bottom:10px}.check{display:flex;gap:11px;align-items:flex-start;padding:12px 4px;border-top:1px solid #edf1f5;line-height:1.45}.check input{width:24px;height:24px;flex:0 0 24px;margin:0}.dash{margin-top:10px;width:100%;padding:10px;border:1px dashed #b9c6d5;border-radius:12px;background:#fff;font-weight:700}.dash.active{background:#f0f2f5;border-style:solid}
.stickyActions{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid #dbe3ec;padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.stickyActions .inner{max-width:760px;margin:auto;display:grid;grid-template-columns:100px 1fr;gap:10px}.stickyActions .btn{padding:13px}
.summaryScore{text-align:center;padding:18px;border-radius:16px;background:linear-gradient(135deg,#0b1f3a,#1e5c9e);color:#fff}.summaryScore .num{font-size:42px;font-weight:900}.summaryScore .den{opacity:.75}.summaryScore .pct{margin-top:4px;font-size:14px}.resultItem{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px}.resultTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{font-weight:900;border-radius:999px;padding:5px 9px;background:#eef3f8}.mini{color:var(--muted);font-size:12px;margin-top:4px}.resultGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.metric{background:#f7f9fc;border-radius:10px;padding:9px}.metric strong{float:right}.notice{background:#fff7e6;border:1px solid #f0d89b;border-radius:12px;padding:11px;font-size:13px;line-height:1.55;margin-top:12px}
@media(max-width:430px){main{padding-left:10px;padding-right:10px}.card{padding:15px;border-radius:15px}h1{font-size:22px}.grid2{grid-template-columns:1fr}.choiceGrid{grid-template-columns:1fr}.rating{gap:5px}.rateBtn{font-size:16px}.stickyActions .inner{grid-template-columns:82px 1fr}}
</style>
</head>
<body>
<header><div class="brand">職能評価</div><div class="sub">教室運営版｜職能要件・基 ＋ 職能要件・実</div></header>
<main>
<section id="startView">
 <div class="card">
  <div class="eyebrow">STEP 1</div><h1>評価を始める</h1><div class="lead">氏名・社員番号・自分のColorを入力してください。Colorに対応するLevelが自動で設定されます。</div>
  <label class="form">氏名</label><input id="nameInput" autocomplete="name" placeholder="例：中里 純">
  <label class="form">社員番号</label><input id="idInput" inputmode="numeric" placeholder="例：100001">
  <label class="form">自分のColor</label><select id="ownColor"></select>
 </div>
 <div class="card">
  <div class="eyebrow">STEP 2</div><h2>評価する職能要件</h2>
  <div class="choiceGrid"><button class="bigChoice active" id="chooseBase"><strong>職能要件・基</strong><span>14項目を S・A・B・C・－ で評価</span></button><button class="bigChoice" id="chooseActual"><strong>職能要件・実</strong><span>7項目×知識・技術を3チェックで評価</span></button></div>
  <div id="baseTarget"><label class="form">評価するColor</label><select id="targetColor"></select></div>
  <div id="actualTarget" class="hidden"><label class="form">評価するLevel</label><select id="targetLevel"></select></div>
  <div class="notice">自分のColorと違うColor／Levelを評価したい場合は、ここで変更できます。</div>
  <button class="btn" id="startBtn" style="margin-top:14px">評価を開始</button>
 </div>
</section>
<section id="evalView" class="hidden">
 <div class="card"><div class="eyebrow" id="evalMeta"></div><div class="progress"><div id="progressBar"></div></div><div id="evalContent"></div></div>
</section>
<section id="resultView" class="hidden">
 <div class="card"><div class="eyebrow">RESULT</div><h1>評価結果</h1><div class="lead" id="resultProfile"></div><div class="summaryScore" style="margin-top:14px"><span class="num" id="scoreNum">0</span><span class="den"> / 56点</span><div class="pct" id="scorePct"></div></div><div id="resultList"></div><div class="rowBtns"><button class="btn secondary" id="restartBtn">最初に戻る</button><button class="btn" id="printBtn">印刷・PDF</button></div></div>
</section>
</main>
<div class="stickyActions hidden" id="stickyActions"><div class="inner"><button class="btn secondary" id="backBtn">戻る</button><button class="btn" id="nextBtn">次へ</button></div></div>
<script>const DATA={"version":"2.0","appType":"classroom","colors":["Red","Orange","Yellow","Green","Blue","Indigo","Violet"],"levelByColor":{"Red":1,"Orange":2,"Yellow":3,"Green":4,"Blue":5,"Indigo":6,"Violet":7},"base":[{"no":1,"group":"土台","name":"誠実性","definition":"約束やルール、事実を大切にし、信頼される行動を積み重ねる力","texts":{"Red":"挨拶・時間・身だしなみなど社会人としての基本を守り、分からないことはそのままにせず確認しながら、安心して仕事を任せられる土台を築いている。","Orange":"約束した期限・ルールを守り、事実に基づいた報告・連絡・相談を行うとともに、必要な情報を自ら確認して仕事の信頼性を高めている。","Yellow":"状況の変化や問題が生じた際も事実を正しく伝え、思い込みで判断せず公平な視点で情報を共有することで、周囲が安心して判断できる環境を支えている。","Green":"チームの約束や運用ルールが守られているかを確認し、曖昧な運用を見過ごさないことで、互いに信頼して働ける職場をつくっている。","Blue":"組織全体の判断基準となるルールや運用を率先して守り、一貫した判断と行動を通じて、公正で信頼される組織運営を支えている。","Indigo":"判断に迷う場面でも客観的な事実に基づく誠実な判断を貫き、その姿勢を組織全体へ波及させることで、健全な組織文化を育んでいる。","Violet":"目先の利害に左右されず、顧客や社員との信頼関係を重んじる判断をすることで、理究グループが社会から信頼され続ける企業文化を築いている。"}},{"no":2,"group":"土台","name":"責任感","definition":"任された役割や期待に向き合い、自ら果たすべき責務を最後まで担い続ける力","texts":{"Red":"任された業務や役割を理解し、不明な点は早めに確認しながら、途中で投げ出さず最後までやり遂げている。","Orange":"担当業務で求められる役割を理解し、自らの判断や行動を振り返りながら、期待される責務を着実に果たし続けている。","Yellow":"担当業務で生じた課題や結果を自分事として受け止め、原因を振り返り、必要な対応や改善を最後まで行うことで、周囲からの信頼に応えている。","Green":"チーム全体の状況を踏まえ、自分の担当にとどまらず周囲への支援やフォローを行い、チームとして求められる役割を果たせるようにしている。","Blue":"組織として果たすべき責務を明確にし、状況の変化に応じた判断と調整を続けながら、最後まで責任ある対応を貫いている。","Indigo":"組織の未来のために他部署とも連携して、必要な責務を自ら担い、困難な状況でも役割を果たし続けることで、組織の持続的な発展を支えている。","Violet":"理究グループが社会や顧客から期待される役割を担い続けられるように、長期的な視点での意思決定と実践を自らの責任のもと行っている。"}},{"no":3,"group":"土台","name":"主体性","definition":"指示を待つのではなく、自ら考え、判断し、必要な働きかけを行う力","texts":{"Red":"指導・助言を素直に受け止め、分からないことや必要なことに自ら気付き、確認や相談を行いながら仕事を前へ進めている。","Orange":"担当業務の目的や期待される役割を踏まえ、自ら優先順位を考えて行動し、自分で判断できることは考えて動くことで担当としての信頼を築いている。","Yellow":"担当業務をより良くするために自ら課題や改善点を見つけ、また、現状を踏まえた行動を選択することで、仕事の質を高めている。","Green":"チームに必要な働きかけを自ら行い、目標達成に向けて周囲が動きやすいきっかけをつくることで、チームの前進を支えている。","Blue":"組織の目標や目的を踏まえて必要な行動を判断し、チームや課を越えて働きかけることで、メンバーが力を発揮できる状態をつくり組織全体を前へ進めている。","Indigo":"将来を見据えて組織に必要な変化を察知し、自ら周囲へ働きかけながら、自律的に行動できる組織づくりをしている。","Violet":"社会や顧客の変化やニーズを捉え、新たな事業・サービス・仕組みへ結び付ける構想を描き、組織を巻き込みながらその実現を主導している。"}},{"no":4,"group":"土台","name":"成長志向","definition":"経験から学び続け、自らの成長につなげる力","texts":{"Red":"日々の仕事で学んだことや周囲からの助言を振り返り、できたこと・できなかったことを確認しながら、次の行動に活かしている。","Orange":"自分の強みや課題を把握し、必要な知識や経験を積み重ねながら、学んだことを担当業務で実践し着実に成長している。","Yellow":"成功や失敗の要因を分析して業務改善を重ね、周囲からの助言や仕事の経験を自らの成長につなげながら、担当する役割の幅を広げている。","Green":"チームで得られた経験や学びを周囲へ共有し、互いに学び、高め合える雰囲気づくりに貢献している。","Blue":"組織に必要な学びを見極め、自ら学び続ける姿勢を示すとともに、メンバー一人ひとりの成長を後押しする働きかけを続けている。","Indigo":"人が育つ仕組みや環境を整え、将来必要となる力を見据えた人材育成を計画的に進めることで、組織全体の成長基盤を強化している。","Violet":"理究グループの未来を支える人材が育ち続ける仕組みと組織文化を創り上げ、自律的に学び進化し続ける姿勢とともに、次世代へ継承している。"}},{"no":5,"group":"人と働く","name":"コミュニケーション力","definition":"組織の成果や円滑な業務遂行に向けて、相手の立場や思いを理解・尊重しながら意思疎通を図り、必要な情報や考えを伝え合う力","texts":{"Red":"相手の話を最後まで聴き、指示や依頼の内容を正しく理解するとともに、自分の状況や考えを分かりやすく伝え、認識のずれを防いでいる。","Orange":"相手の立場や理解度に応じて伝え方や確認方法を工夫し、互いの認識を一致させながら担当業務を円滑に進めている。","Yellow":"丁寧な対話と傾聴を通じて相手の立場や状況を把握し、必要な情報を整理して適切なタイミングで共有することで、関係者が迷わず判断できる状態をつくっている。","Green":"チーム内で必要な情報や考えが伝わるよう対話を促し、異なる立場や意見を互いに尊重しながら共通認識を形成することで、チームの円滑な連携につなげている。","Blue":"各課、チーム間の立場や目的の違いを整理し、互いの思いや懸念を受け止めつつ対話を重ねながら合意形成を進めることで、組織全体の連携を促進している。","Indigo":"多様な価値観や背景を持つ関係者の誰もが安心して発言できる環境をつくり、組織の方針や考えを分かりやすく言語化して共有することで、組織の方向性を一致させている。","Violet":"子ども・保護者・地域・社員など多様な関係者それぞれの思いや期待を丁寧に汲み取り、つなぐことで、理究グループが目指す未来への理解と共感を広げている。"}},{"no":6,"group":"人と働く","name":"協働性","definition":"互いの強みや役割を活かし合い、一人では生み出せない成果につなげる力","texts":{"Red":"自分の役割を果たすとともに、困っている仲間へ声をかけ、必要に応じて支え合いながら仕事を進めている。","Orange":"自分と周囲の役割を理解し、相手の状況に応じた協力を行うことで、担当業務が円滑に進むよう支えている。","Yellow":"一人ひとりの得意なことを活かしながら役割を補完し合い、共通の目的に向けて互いに力を発揮できる状態をつくっている。","Green":"チーム全体を見渡して必要な支援や調整を行い、それぞれの強みを活かした役割分担で互いに補い合う関係を築いている。","Blue":"チームや課を越えて人や情報をつなぎ、それぞれの専門性と強みを組み合わせることで、組織全体の力を高めている。","Indigo":"多様な人材が互いの強みを発揮できる環境を整え、部署の枠を越えた協働を促進している。","Violet":"理究グループ全体の知恵と強みを結び付け、保育・教育の未来を支える新たな価値を共創している。"}},{"no":7,"group":"人と働く","name":"影響力","definition":"自らの姿勢や働きかけを通じて、相手が自発的に行動したくなる状態をつくる力","texts":{"Red":"自ら模範となる行動を積み重ね、周囲から安心して相談される存在となっている。","Orange":"根拠を示して提案・説明を行い、相手の状況に応じた声かけを通じて、自発的な行動につながるきっかけをつくっている。","Yellow":"相手の考えや思い、背景を理解した上で適切な働きかけをし、一人ひとりが自ら判断して行動できるよう後押ししている。","Green":"一人ひとりの意欲や強みを認め、承認を積み重ねることで、チーム全体が前向きに挑戦できる職場環境をつくっている。","Blue":"組織が目指す方向を分かりやすく示し、自ら率先して行動することで、多くのメンバーが同じ目標、目的へ向かって動く流れを生み出している。","Indigo":"人の成長を信じて可能性を引き出し、自ら動き挑戦し続ける人材が増える組織風土を育んでいる。","Violet":"理究グループが大切にする考え方と行動を全社にとどまらず広げることで、「理究と一緒に未来をつくりたい」と共感する人を増やしている。"}},{"no":8,"group":"成果を 出す","name":"実行力","definition":"目標や目的の実現に向けて必要な行動を着実に進め、計画した状態まで到達させる力","texts":{"Red":"教わった手順を守り、優先順位を確認しながら、一つひとつの業務を概ね予定どおり完了している。","Orange":"複数の業務の優先順位を判断し、期限を踏まえて計画的に進め、完了することで、安定した仕事ぶりを発揮している。","Yellow":"目標や目的に対し、必要な工程を組み立て、状況の変化に応じて進め方を柔軟に見直しながら、求められる水準でやり遂げている。","Green":"チーム全体の進捗を把握し、遅れや偏りを調整することで、計画どおりチームが前へ進む状態を維持している。","Blue":"組織の重点課題を工程（KPI）ごとに着実に推進し、複数の取り組みが連動して前進する状態をつくっている。","Indigo":"中長期の構想（事業計画）を実現するために必要な段階を設計し、困難な状況でも着実に前進し続ける実行体制を整えている。","Violet":"理究グループの未来につながる重要な挑戦を構想だけで終わらせず、着実に実現段階へ導き、次の成長へ結び付く基盤を築いている。"}},{"no":9,"group":"成果を 出す","name":"課題解決力","definition":"現状を整理・分析し、課題の本質を捉えて適切な解決策を導き出す力","texts":{"Red":"困ったことや気になることをそのままにせず、周囲へ相談しながら事実を整理し、何が問題かを明確にしている。","Orange":"担当業務で起きた問題について事実と原因を整理し、再発防止につながる改善策を考え、実践している。","Yellow":"表面的な事象にとらわれず、目標とのギャップを生み出している本質的な原因や課題（ボトルネック）を見極め、解決策を導き出している。","Green":"チームで発生する課題を構造的に整理し、関係者と協力しながら、優先して解決すべき課題に取り組んでいる。","Blue":"組織全体の課題を多面的に分析し、根本的な解決につながる方向性を示して、周囲を巻き込みながら推進している。","Indigo":"将来起こり得る課題を予測し、顕在化する前に対策を講じることで、組織の安定と成長を先回りして支えている。","Violet":"保育・教育を取り巻く環境の変化を見据え、理究グループが向き合うべき経営課題を示し、持続可能な解決へ導いている。"}},{"no":10,"group":"成果を 出す","name":"創意工夫力","definition":"既存の方法にとらわれず、新たな発想や組み合わせによって、より良い方法や価値を生み出す力","texts":{"Red":"教わった方法を身に付けた上で、自分なりにより良い進め方を考え、身近な工夫を取り入れながら仕事に取り組んでいる。","Orange":"既存のやり方を応用し、担当業務をより効率的・効果的に進めるための新しい方法や工夫を積極的に取り入れている。","Yellow":"異なる事例や知見を組み合わせ、担当業務に新しい進め方や仕組みを生み出し、実践している。","Green":"チームの経験や知恵を組み合わせ、これまでになかった仕事の進め方であっても形にしてチームへ広げている。","Blue":"組織内の知見を横断的に結び付け、新たな業務プロセスや仕組みにつながる方法（現状の可視化や非効率部分の特定と改善などを含む）を生み出している。","Indigo":"部署を超えた多様なノウハウや視点を融合し、理究グループの新たな強みとなる仕組みや価値を創出し、継続的な改善の風土を育んでいる。","Violet":"保育・教育の新たな可能性を切り拓く発想を形にし、社会や顧客の期待を超える価値として、理究グループから広げている。"}},{"no":11,"group":"未来を 創る","name":"挑戦志向","definition":"現状に満足せず、より良い未来に向けて新しい一歩を踏み出す力","texts":{"Red":"初めての仕事や経験にも前向きに取り組み、失敗を恐れず自ら行動の幅を広げている。","Orange":"担当業務で経験のない役割にも臆せず手を挙げ、新しい経験を自ら積み重ねている。","Yellow":"現状に満足せず、より良い方法や一段高い目標へ向けて小さな挑戦を継続的に積み重ねている。","Green":"チームとして新しい取組へ踏み出せるよう、不安を受け止めながら挑戦を後押しする雰囲気をつくっている。","Blue":"組織の成長に必要な変革を捉え、前例にとらわれない新しい取り組みへ率先して挑戦できる環境を整えている。","Indigo":"将来を見据えた挑戦を後押しし、挑戦から学び続ける文化を組織へ根付かせることで、次の成長機会を創り出している。","Violet":"理究グループの未来を見据え、社会の変化を新たな可能性へ変える挑戦を先導し、価値を創出する文化を築いている。"}},{"no":12,"group":"未来を 創る","name":"最適化力","definition":"全体を俯瞰し、成果につながるより良い状態へ整える力","texts":{"Red":"自分の仕事の優先順位や進め方を見直し、無理や無駄のない進め方を選んで、正確かつ効率的に業務を進めている。","Orange":"担当業務全体を見渡し、無駄や重複を減らす工夫を行いながら、関係者と調整して効率的に仕事を進めている。","Yellow":"業務全体の流れを整理し、品質と効率の両立を意識して継続的に業務フローを改善している。","Green":"チーム全体の状況を俯瞰し、人・物・金・情報/技術と時間、役割を適切に組み合わせることで、チームが力を最大限に発揮できる状態をつくっている。","Blue":"組織全体を俯瞰し、戦略の立案から顧客への価値提供、計画の完遂、そして次世代の育成に至る一連のプロセスを結び付けながら、継続して成果を生み出せる仕組みを整えている。","Indigo":"部門を越えて組織全体を最適な状態へ導き、変化に応じて仕組みそのものを進化させる組織運営基盤を構築している。","Violet":"理究グループ全体を俯瞰し、人と組織、事業が時代の変化に適応しながら自律的・持続的に進化し続けられる、再現性の高い成長基盤を構築している。"}},{"no":13,"group":"未来を 創る","name":"理念実践","definition":"理究グループの理念や価値観を判断基準とし、日々の行動や意思決定で体現する力","texts":{"Red":"理究グループの理念や価値観を理解し、日々の仕事で実践している。","Orange":"判断に迷ったときは理念や行動指針に立ち返り、理念を基準として行動を選択している。","Yellow":"日々の行動と理念とのつながりを確認し、振り返りながら改善を続けることで、周囲へ良い影響を与えている。","Green":"チームで理念を共有し、自らの行動を通じて実践の手本となることで、日々の仕事の中で自然に理念が体現される状態をつくっている。","Blue":"各課、チームの判断や取り組みが理念に沿っているかを確認し、組織の方針や制度に理念を反映させることで、一貫した組織運営を支えている。","Indigo":"理念を組織文化として根付かせるための人づくり・仕組みづくりを継続して進め、理究グループらしい組織づくりを推進している。","Violet":"理究グループの理念を未来へ継承し、社会から信頼され、選ばれ続ける企業文化を創り上げている。"}},{"no":14,"group":"未来を 創る","name":"価値創造力","definition":"顧客や社会の期待を捉え、\n新たな価値を生み出す力","texts":{"Red":"相手が何を求めているかを考え、自分の仕事にひと工夫を加えることで期待に応える行動を積み重ねている。","Orange":"相手の立場から考え、担当業務を通じて期待を上回る工夫を行い、新たな喜びや満足につなげている。","Yellow":"顧客や現場の声から潜在的なニーズを捉え、これまでにない価値につながる提案や工夫を担当業務の中で形にしている。","Green":"チームの強みと知恵を結び付け、顧客にとってより高い価値を生み出す新たなサービスや取り組みを進めている。","Blue" function syncFromOwn(){const c=$('ownColor').value;$('targetColor').value=c;$('targetLevel').value=DATA.levelByColor[c]||1;saveProfile()}

syncFromOwn();$('ownColor').addEventListener('change',syncFromOwn);$('nameInput').addEventListener('input',saveProfile);$('idInput').addEventListener('input',saveProfile);

$('chooseBase').onclick=()=>setMode('base');$('chooseActual').onclick=()=>setMode('actual');

function gradeFor(part){if(part.dash)return '－';const n=part.checks.filter(Boolean).length;return n===3?'S':n===2?'A':n===1?'B':'C'}
function ensureActualAnswer(){if(!answers[index])answers[index]={知識:{checks:[false,false,false],dash:false,touched:false},技術:{checks:[false,false,false],dash:false,touched:false}};return answers[index]}
function renderActual(){const it=actualCurrent(),lvl=it.levels[String(profile.targetLevel)],ans=ensureActualAnswer();let html=`<div class="titleBox"><h2>${esc(it.title)}</h2><div class="def">${esc(it.description)}</div></div>`;['知識','技術'].forEach(kind=>{const d=lvl[kind],a=ans[kind],g=gradeFor(a);html+=`<div class="section"><div class="sectionHead"><div><div class="eyebrow">${kind}</div><div class="heading">${esc(d.heading)}</div></div><div class="badge">${g}</div></div>${d.checks.map((t,i)=>`<label class="check"><input type="checkbox" data-kind="${kind}" data-i="${i}" ${a.checks[i]?'checked':''} ${a.dash?'disabled':''}><span>${esc(t)}</span></label>`).join('')}<button class="dash ${(!a.dash&&a.touched&&a.checks.every(v=>!v))?'active':''}" data-zero="${kind}">C　チェックなしで確定</button><button class="dash ${a.dash?'active':''}" data-dash="${kind}">－ 対象外</button></div>`});$('evalContent').innerHTML=html;document.querySelectorAll('input[type=checkbox]').forEach(ch=>ch.onchange=()=>{const a=ensureActualAnswer()[ch.dataset.kind];a.checks[Number(ch.dataset.i)]=ch.checked;a.touched=true;renderActual()});document.querySelectorAll('[data-zero]').forEach(b=>b.onclick=()=>{const a=ensureActualAnswer()[b.dataset.zero];a.checks=[false,false,false];a.dash=false;a.touched=true;renderActual()});document.querySelectorAll('[data-dash]').forEach(b=>b.onclick=()=>{const a=ensureActualAnswer()[b.dataset.dash];a.dash=!a.dash;a.touched=true;if(a.dash)a.checks=[false,false,false];renderActual()})}
function validateCurrent(){if(mode==='base'){if(!answers[index]?.grade){alert('S・A・B・C・－のいずれかを選んでください');return false}return true}const a=ensureActualAnswer();if(!a.知識.touched||!a.技術.touched){alert('知識・技術それぞれについて、チェック・「C チェックなしで確定」・「－ 対象外」のいずれかで評価を確定してください。');return false}return true}
function next(){if(!validateCurrent())return;const total=mode==='base'?DATA.base.length:DATA.actual.length;if(index<total-1){index++;renderEval();scrollTo({top:0,behavior:'smooth'})}else finish()}
function back(){if(index>0){index--;renderEval();scrollTo({top:0,behavior:'smooth'})}}
$('nextBtn').onclick=next;$('backBtn').onclick=back;
function finish(){$('evalView').classList.add('hidden');$('stickyActions').classList.add('hidden');$('resultView').classList.remove('hidden');renderResults();scrollTo({top:0,behavior:'smooth'})}
function renderResults(){let total=0,html='';if(mode==='base'){DATA.base.forEach((it,i)=>{const g=answers[i].grade,s=SCORE[g];total+=s;html+=`<div class="resultItem"><div class="resultTop"><strong>${it.no}．${esc(it.name)}</strong><span class="pill">${g}｜${s}点</span></div><div class="mini">${esc(it.group)}｜${esc(profile.targetColor)}</div></div>`})}else{DATA.actual.forEach((it,i)=>{const a=answers[i],kg=gradeFor(a.知識),tg=gradeFor(a.技術),ks=SCORE[kg],ts=SCORE[tg];total+=ks+ts;html+=`<div class="resultItem"><div class="resultTop"><strong>${esc(it.title)}</strong><span class="pill">${ks+ts}点</span></div><div class="resultGrid"><div class="metric">知識 <strong>${kg}｜${ks}</strong></div><div class="metric">技術 <strong>${tg}｜${ts}</strong></div></div></div>`})}$('scoreNum').textContent=total;$('scorePct').textContent=`100点換算 ${(total/56*100).toFixed(1)}点`;$('resultProfile').textContent=`${profile.name}（${profile.id}）｜自分のColor：${profile.ownColor}｜${mode==='base'?'評価Color：'+profile.targetColor:'評価Level：Level '+profile.targetLevel}`;$('resultList').innerHTML=html}
$('restartBtn').onclick=()=>{$('resultView').classList.add('hidden');$('startView').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};$('printBtn').onclick=()=>window.print();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body></html>
